name: Fetch coin photos
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/fetch_coins.py", ".github/workflows/fetch-coins.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_coins.py
      - name: Commit coins
        run: |
          git config user.name "Sfzmango"
          git config user.email "101447695+Sfzmango@users.noreply.github.com"
          git add coins
          git diff --cached --quiet || git commit -m "Add coin photos"
          git push
